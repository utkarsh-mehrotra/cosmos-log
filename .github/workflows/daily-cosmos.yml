name: Daily Cosmos Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git identity
        run: |
          git config --local user.email "utkarshmehrotra.live@gmail.com"
          git config --local user.name "Utkarsh Mehrotra"

      - name: Fetch APOD, catch up on gaps, commit with staggered timing
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python schedule_and_commit.py

      - name: Push
        run: git push origin main || echo "Nothing to push"
